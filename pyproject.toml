[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-gateway"
version = "0.1.0"
description = "Local push-to-talk voice gateway for Launchpad, whisper.cpp, and Hermes."
readme = "voice-gateway-integration.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
voice-gateway = "voice_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
